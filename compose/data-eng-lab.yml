# data-eng-lab overlay — appended to Atlas's compose invocation via the
# compose_overlays: entry in atlas.consumer.yml (no legacy user-service symlink).
# Relative host paths resolve against the compose project directory (`infra/`).
# This overlay adds one consumer-owned internal service and patches existing
# Atlas consumers; Atlas source remains unchanged.
services:
  iceberg-rest-probe:
    build:
      context: ..
      dockerfile: observability/iceberg-rest-probe.Dockerfile
    platform: linux/amd64
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      ICEBERG_REST_PROBE_ORIGIN: http://iceberg-rest:8181
      ICEBERG_REST_PROBE_TIMEOUT_SECONDS: "2"
      ICEBERG_REST_PROBE_MAX_BODY_BYTES: "65536"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 32
        reservations:
          cpus: "0.05"
          memory: 16M
    networks:
      - backend-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket,urllib.request; host=socket.inet_ntoa(bytes((127,0,0,1))); urllib.request.urlopen('http://'+host+':8080/healthz', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  prometheus:
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules/iceberg-rest.yml:/etc/data-eng-lab-prometheus/rules/iceberg-rest.yml:ro

  grafana:
    environment:
      GF_PATHS_PROVISIONING: /etc/data-eng-lab-grafana/provisioning
    volumes:
      - ./services/grafana/config/provisioning/alerting:/etc/data-eng-lab-grafana/provisioning/alerting:ro
      - ./services/grafana/config/provisioning/datasources:/etc/data-eng-lab-grafana/provisioning/datasources:ro
      - ./services/grafana/config/provisioning/plugins:/etc/data-eng-lab-grafana/provisioning/plugins:ro
      - ./services/grafana/config/provisioning/dashboards/app-tier.json:/etc/data-eng-lab-grafana/atlas-dashboards/app-tier.json:ro
      - ./services/grafana/config/provisioning/dashboards/containers-and-host.json:/etc/data-eng-lab-grafana/atlas-dashboards/containers-and-host.json:ro
      - ./services/grafana/config/provisioning/dashboards/kong.json:/etc/data-eng-lab-grafana/atlas-dashboards/kong.json:ro
      - ./services/grafana/config/provisioning/dashboards/litellm.json:/etc/data-eng-lab-grafana/atlas-dashboards/litellm.json:ro
      - ./services/grafana/config/provisioning/dashboards/n8n.json:/etc/data-eng-lab-grafana/atlas-dashboards/n8n.json:ro
      - ./services/grafana/config/provisioning/dashboards/postgres-redis.json:/etc/data-eng-lab-grafana/atlas-dashboards/postgres-redis.json:ro
      - ./services/grafana/config/provisioning/dashboards/stack-overview.json:/etc/data-eng-lab-grafana/atlas-dashboards/stack-overview.json:ro
      - ../observability/grafana/provisioning:/etc/data-eng-lab-grafana/provisioning/dashboards:ro
      - ../observability/grafana/iceberg-rest.json:/etc/data-eng-lab-grafana/issue-dashboards/iceberg-rest.json:ro

  checkpoint-retention-init:
    image: ${MINIO_INIT_IMAGE}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_RETENTION_ACCESS_KEY: ${MINIO_RETENTION_ACCESS_KEY:?MINIO_RETENTION_ACCESS_KEY is required}
      MINIO_RETENTION_SECRET_KEY: ${MINIO_RETENTION_SECRET_KEY:?MINIO_RETENTION_SECRET_KEY is required}
    volumes:
      - ../checkpoints/provision-retention.sh:/config/provision-retention.sh:ro
      - ../checkpoints/retention-policy.json:/config/retention-policy.json:ro
    entrypoint: ["/bin/sh", "/config/provision-retention.sh"]
    networks:
      - backend-network

  checkpoint-retention:
    build:
      context: ..
      dockerfile: checkpoints/retention.Dockerfile
    platform: linux/amd64
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_RETENTION_ACCESS_KEY: ${MINIO_RETENTION_ACCESS_KEY:?MINIO_RETENTION_ACCESS_KEY is required}
      MINIO_RETENTION_SECRET_KEY: ${MINIO_RETENTION_SECRET_KEY:?MINIO_RETENTION_SECRET_KEY is required}
      CHECKPOINT_RETENTION_LEASE_TOKEN: ${CHECKPOINT_RETENTION_LEASE_TOKEN:?CHECKPOINT_RETENTION_LEASE_TOKEN is required}
      CHECKPOINT_RETENTION_OPERATOR_TOKEN: ${CHECKPOINT_RETENTION_OPERATOR_TOKEN:?CHECKPOINT_RETENTION_OPERATOR_TOKEN is required}
      DESTRUCTIVE_ENABLED: ${CHECKPOINT_RETENTION_DESTRUCTIVE_ENABLED:-false}
    depends_on:
      checkpoint-retention-init:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - backend-network
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - import socket,urllib.request; host=socket.inet_ntoa(bytes((127,0,0,1))); urllib.request.urlopen('http://'+host+':8080/healthz', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  dataset-resolver:
    build:
      context: ..
      dockerfile: datasets/resolver.Dockerfile
    platform: linux/amd64
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - import socket,urllib.request; host=socket.inet_ntoa(bytes((127,0,0,1))); urllib.request.urlopen('http://'+host+':8080/healthz', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  airflow-scheduler:
    environment:
      DATASET_RESOLVER_URI: http://dataset-resolver:8080
      DATASET_SCALE: ${DATASET_SCALE:-small}
      AIRFLOW_CONN_TRINO_DEFAULT: http://trino:8080
      CHECKPOINT_RETENTION_URI: http://checkpoint-retention:8080
      CHECKPOINT_RETENTION_OPERATOR_TOKEN: ${CHECKPOINT_RETENTION_OPERATOR_TOKEN:?CHECKPOINT_RETENTION_OPERATOR_TOKEN is required}
    depends_on:
      dataset-resolver:
        condition: service_healthy
      checkpoint-retention:
        condition: service_healthy
    volumes:
      - ../spark-apps:/opt/airflow/dags/data_eng_lab_spark_apps:ro
      - ../airflow-dags:/opt/airflow/dags/data_eng_lab_airflow_dags:ro
      - ../datasets:/opt/data-eng-lab/datasets:ro
      - ../tests/infra/probes:/opt/probes:ro

  airflow-dag-processor:
    volumes:
      - ../spark-apps:/opt/airflow/dags/data_eng_lab_spark_apps:ro
      - ../airflow-dags:/opt/airflow/dags/data_eng_lab_airflow_dags:ro

  jupyterhub:
    environment:
      DATASET_RESOLVER_URI: http://dataset-resolver:8080
      DATASET_SCALE: ${DATASET_SCALE:-small}
      CHECKPOINT_RETENTION_URI: http://checkpoint-retention:8080
      CHECKPOINT_RETENTION_LEASE_TOKEN: ${CHECKPOINT_RETENTION_LEASE_TOKEN:?CHECKPOINT_RETENTION_LEASE_TOKEN is required}
      PYTHONPATH: /opt/data-eng-lab
    depends_on:
      dataset-resolver:
        condition: service_healthy
      checkpoint-retention:
        condition: service_healthy
    volumes:
      - ../datasets:/home/jovyan/data-eng-lab/datasets:ro
      - ../scripts/checkpoints:/opt/data-eng-lab/scripts/checkpoints:ro
      - ../tests/infra/probes:/opt/probes:ro

  zeppelin:
    environment:
      DATASET_RESOLVER_URI: http://dataset-resolver:8080
      DATASET_SCALE: ${DATASET_SCALE:-small}
      CHECKPOINT_RETENTION_URI: http://checkpoint-retention:8080
      CHECKPOINT_RETENTION_LEASE_TOKEN: ${CHECKPOINT_RETENTION_LEASE_TOKEN:?CHECKPOINT_RETENTION_LEASE_TOKEN is required}
      PYTHONPATH: /opt/data-eng-lab
    depends_on:
      dataset-resolver:
        condition: service_healthy
      checkpoint-retention:
        condition: service_healthy
    volumes:
      - ../scripts/checkpoints:/opt/data-eng-lab/scripts/checkpoints:ro
