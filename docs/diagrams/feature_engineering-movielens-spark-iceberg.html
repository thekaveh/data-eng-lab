<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>data-eng-lab - MovieLens feature pipeline</title></head>
<body>
<!-- Verified against scenarios/execution-modes.yaml and the production implementation on 2026-08-12. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'JetBrains Mono', 'Courier New', monospace" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Production MovieLens feature pipeline</title>
  <desc id="diagram-description">A resolver-verified MovieLens publication flows through serialized Airflow orchestration and a reviewed Scala Spark application into two provenance-bound Iceberg Gold tables.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="#020617"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <text x="640" y="42" fill="#f8fafc" font-size="23" font-weight="700" text-anchor="middle">MovieLens Feature Pipeline - Governed Production Path</text>
  <text x="640" y="67" fill="#94a3b8" font-size="12" text-anchor="middle">One immutable generation, two deterministic aggregates, equal provenance</text>

  <!-- Connectors are drawn first so component cards remain visually foregrounded. -->
  <g fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 225H330"/>
    <path d="M590 225H650"/>
    <path d="M910 225H970"/>
    <path d="M1070 330V370"/>
    <path d="M1070 480V520"/>
    <path d="M780 330V370"/>
  </g>

  <g>
    <rect x="40" y="130" width="230" height="200" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="155" y="158" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">VERIFIED INPUT</text>
    <text x="155" y="195" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Resolver-verified MovieLens publication</text>
    <line x1="65" y1="224" x2="245" y2="224" stroke="#334155"/>
    <text x="155" y="247" fill="#cbd5e1" font-size="10" text-anchor="middle">exact scale-specific order</text>
    <text x="155" y="265" fill="#cbd5e1" font-size="10" text-anchor="middle">canonical generation URIs</text>
    <text x="155" y="283" fill="#cbd5e1" font-size="10" text-anchor="middle">plan + publication + manifest</text>
    <text x="155" y="306" fill="#34d399" font-size="10" text-anchor="middle">resolver verification required</text>

    <rect x="330" y="130" width="260" height="200" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="460" y="158" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">PRODUCTION BOUNDARY</text>
    <text x="460" y="188" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Airflow @daily</text>
    <text x="460" y="210" fill="#f8fafc" font-size="12" text-anchor="middle">movielens_feature_pipeline</text>
    <line x1="355" y1="226" x2="565" y2="226" stroke="#334155"/>
    <text x="460" y="250" fill="#cbd5e1" font-size="10" text-anchor="middle">max_active_runs=1</text>
    <text x="460" y="270" fill="#cbd5e1" font-size="10" text-anchor="middle">Spark cluster mode</text>
    <text x="460" y="290" fill="#cbd5e1" font-size="10" text-anchor="middle">RestConfirmingSparkHook</text>
    <text x="460" y="310" fill="#34d399" font-size="10" text-anchor="middle">FINISHED and success=true</text>

    <rect x="650" y="130" width="260" height="200" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="780" y="158" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="middle">SCALA SPARK APP</text>
    <text x="780" y="187" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Explicit ratings schema</text>
    <text x="780" y="208" fill="#cbd5e1" font-size="10" text-anchor="middle">userId long | movieId long</text>
    <text x="780" y="226" fill="#cbd5e1" font-size="10" text-anchor="middle">rating double | timestamp long</text>
    <line x1="675" y1="242" x2="885" y2="242" stroke="#334155"/>
    <text x="780" y="265" fill="#cbd5e1" font-size="10" text-anchor="middle">required fields + finite ratings</text>
    <text x="780" y="283" fill="#cbd5e1" font-size="10" text-anchor="middle">duplicate rows count separately</text>
    <text x="780" y="306" fill="#34d399" font-size="10" text-anchor="middle">materialize both before write</text>

    <rect x="970" y="130" width="270" height="200" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="1105" y="158" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">DETERMINISTIC AGGREGATES</text>
    <text x="1105" y="190" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">groupBy(userId)</text>
    <text x="1105" y="210" fill="#cbd5e1" font-size="10" text-anchor="middle">avg_rating + num_ratings</text>
    <line x1="995" y1="229" x2="1215" y2="229" stroke="#334155"/>
    <text x="1105" y="255" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">groupBy(movieId)</text>
    <text x="1105" y="275" fill="#cbd5e1" font-size="10" text-anchor="middle">movie_avg + popularity</text>
    <text x="1105" y="306" fill="#34d399" font-size="10" text-anchor="middle">both count sums = input rows</text>

    <rect x="670" y="370" width="220" height="150" rx="12" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <text x="780" y="398" fill="#fb7185" font-size="12" font-weight="700" text-anchor="middle">RECOVERY CONTRACT</text>
    <text x="780" y="429" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">No cross-table atomic commit</text>
    <text x="780" y="452" fill="#cbd5e1" font-size="9" text-anchor="middle">partial failure fails the DAG</text>
    <text x="780" y="470" fill="#cbd5e1" font-size="9" text-anchor="middle">same-generation rerun converges</text>
    <text x="780" y="496" fill="#fb7185" font-size="9" text-anchor="middle">direct concurrent JAR runs unsupported</text>

    <rect x="940" y="370" width="260" height="110" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="1070" y="398" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">User features first</text>
    <text x="1070" y="422" fill="#f8fafc" font-size="11" text-anchor="middle">lakehouse.gold.ml_user_features</text>
    <text x="1070" y="444" fill="#cbd5e1" font-size="9" text-anchor="middle">userId | avg_rating | num_ratings</text>
    <text x="1070" y="463" fill="#cbd5e1" font-size="9" text-anchor="middle">replace + readback</text>

    <rect x="940" y="520" width="260" height="110" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="1070" y="548" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Movie features second</text>
    <text x="1070" y="572" fill="#f8fafc" font-size="11" text-anchor="middle">lakehouse.gold.ml_movie_features</text>
    <text x="1070" y="594" fill="#cbd5e1" font-size="9" text-anchor="middle">movieId | movie_avg | popularity</text>
    <text x="1070" y="613" fill="#cbd5e1" font-size="9" text-anchor="middle">replace + readback</text>

    <rect x="40" y="570" width="850" height="88" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="65" y="600" fill="#38bdf8" font-size="12" font-weight="700">Five equal provenance properties</text>
    <text x="65" y="624" fill="#cbd5e1" font-size="10">dataset | scale | plan_id | publication_id | manifest_sha256</text>
    <text x="65" y="646" fill="#94a3b8" font-size="9">Read back both schemas, keyed rows, measures, and properties; downstream consumers fail closed on absence or mismatch.</text>
  </g>
  <text x="640" y="682" fill="#64748b" font-size="9" text-anchor="middle">Educational notebooks can replace these tables without production provenance; they are not a production write path.</text>
  <text x="640" y="700" fill="#34d399" font-size="9" text-anchor="middle">Execution mode: existing production DAG | spark-apps/movielens-feature-pipeline/dag.py</text>
</svg>
</body>
</html>
