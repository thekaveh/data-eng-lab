version: 1
scenarios:
  - scenario_id: batch_ingest-nyc_taxi-spark-iceberg
    classification: existing production DAG
    justification: The reviewed NYC Taxi ETL application performs the same resolver-gated batch ingest and replaces the Bronze table; the former scenario-local DAG was a superseded no-op.
    owner: Data Engineering
    runtime: Atlas Airflow and Spark standalone via the nyc-taxi-etl JAR
    schedule_policy: "@daily with manual trigger and explicit dataset_scale supported"
    execution_entrypoint: spark-apps/nyc-taxi-etl/dag.py
    dependencies:
      - "#78 operator-owned Spark submission"
      - "#81 verified dataset resolver"
    acceptance_contract:
      - The Airflow task resolves one expected-scale immutable NYC Taxi generation and passes only those URIs to Spark.
      - The run replaces lakehouse.bronze.nyc_taxi_trips and ends with Airflow success plus Spark FINISHED and success=true.
    child_issue: null
  - scenario_id: bi_query-tpch-trino-iceberg
    classification: existing production DAG
    justification: The daily read-only Airflow task validates both TPC-H tables' exact five-key provenance and stable snapshots before accepting a bounded canonical segment-revenue XCom artifact.
    owner: Analytics Engineering
    runtime: Atlas Airflow PythonOperator using the bounded consumer-owned Trino HTTP statement client
    schedule_policy: Daily at 01:00 UTC; max_active_runs=1 and one retry after two minutes
    execution_entrypoint: airflow-dags/trino_bi/dag.py
    dependencies:
      - "#82 execution-mode matrix"
      - "#83 Trino Airflow execution contract"
      - "#107 production TPC-H star schema"
    acceptance_contract:
      - Fail closed before BI SQL unless both $properties tables contain the exact equal five-key TPC-H provenance contract.
      - Return a bounded canonical metadata-DB XCom segment-revenue artifact only after schema, source reconciliation, and unchanged postflight property/snapshot checks.
    child_issue: null
  - scenario_id: cdc_streaming-online_retail-spark-iceberg
    classification: intentionally unscheduled long-running streaming
    justification: The notebook owns an unbounded Redpanda readStream and foreachBatch MERGE with durable checkpoint state; a periodic batch schedule would misrepresent its lifecycle.
    owner: Streaming Data Engineering
    runtime: Operator-started Atlas Zeppelin or Jupyter Spark Structured Streaming session
    schedule_policy: Intentionally unscheduled; an operator starts, monitors, and stops the continuous query
    execution_entrypoint: null
    dependencies:
      - Atlas Redpanda and Spark Kafka integration
      - "online_retail_cdc topic and checkpoint ownership policy #85"
    acceptance_contract:
      - Apply ordered CDC micro-batches idempotently to lakehouse.silver.online_retail_cdc through foreachBatch MERGE.
      - Preserve and monitor the owned checkpoint; fail rather than launch a second writer with ambiguous ownership.
    child_issue: null
  - scenario_id: data_quality-nyc_taxi-spark-iceberg
    classification: approved new production DAG
    justification: Quality enforcement is operational work that requires durable quality facts, reviewed thresholds, dashboard visibility, and operator failure semantics.
    owner: Data Quality Engineering
    runtime: "Production Atlas Airflow and Spark standalone application owned by child issue #91"
    schedule_policy: "No schedule until #91 passes terminal live Airflow and Spark acceptance; proposed after the matching NYC Taxi Bronze load"
    execution_entrypoint: null
    dependencies:
      - "#82 execution-mode matrix"
      - "#81 verified dataset provenance"
      - "#91 durable quality monitoring"
      - nyc_taxi_etl Bronze table
    acceptance_contract:
      - Persist versioned Bronze, Silver, and Gold quality facts with owners, thresholds, severity, lineage, and a durable dashboard or query surface.
      - "Prove pass, warn, fail, missing, stale, recovery, and operator-response behavior in a terminally successful live Atlas Airflow and Spark run owned by #91."
    child_issue: 91
  - scenario_id: feature_engineering-movielens-spark-iceberg
    classification: existing production DAG
    justification: The reviewed application preserves the notebook aggregations, binds both Gold tables to one verified MovieLens generation, and passed repeatable Airflow and Spark acceptance.
    owner: ML Data Engineering
    runtime: Atlas Airflow and Spark standalone via the movielens-feature-pipeline JAR
    schedule_policy: "@daily with manual trigger and explicit dataset_scale supported; max_active_runs=1 serializes the two-table replacement"
    execution_entrypoint: spark-apps/movielens-feature-pipeline/dag.py
    dependencies:
      - "#82 execution-mode matrix"
      - "#81 verified MovieLens generations"
      - "#108 feature pipeline implementation and live acceptance"
    acceptance_contract:
      - Deterministically replace lakehouse.gold.ml_user_features and lakehouse.gold.ml_movie_features from one verified MovieLens generation.
      - Freeze schemas, duplicate-row aggregation semantics, key behavior, count invariants, five-key provenance, and idempotence with live Airflow and Spark success.
    child_issue: null
