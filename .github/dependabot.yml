version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: tuesday
      time: "04:20"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /datasets
    target-branch: develop
    schedule:
      interval: weekly
      day: thursday
      time: "04:25"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      python-lock:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /spark-apps/gh-archive-pipeline
