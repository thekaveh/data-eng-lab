name: docs-deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scenarios/**/README.md"
      - "spark-apps/**/README.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - run: uv run --group dev python -m scripts.docs.check_docs --root .

      - run: uv run --group dev python -m scripts.docs.build_docs --site --root .

      - run: uv run --group dev mkdocs build --strict

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  wiki-build:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - run: uv run --group dev python -m scripts.docs.check_docs --root .

      - run: uv run --group dev python -m scripts.docs.build_docs --wiki --root .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wiki-${{ github.sha }}
          path: generated/wiki
          if-no-files-found: error
          retention-days: 1

  wiki:
    if: github.ref == 'refs/heads/main'
    needs: wiki-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wiki-${{ github.sha }}
          path: generated/wiki

      - name: Verify privileged local wiki-push script
        run: echo "eadc538e18f5e13642df306e6e7e589bfa4719a43af44b9f1fc5a5c2bd35421a  scripts/docs/push_wiki.py" | sha256sum --check --strict

      - name: Push generated wiki
        env:
          WIKI_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: /usr/bin/python3 -I scripts/docs/push_wiki.py --push --root .
