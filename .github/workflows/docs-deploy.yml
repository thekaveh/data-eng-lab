name: docs-deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scenarios/**/README.md"
      - "spark-apps/**/README.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - run: uv run --group dev python -m scripts.docs.check_docs --root .

      - run: uv run --group dev python -m scripts.docs.build_docs --site --root .

      - run: uv run --group dev mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  wiki-build:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - run: uv run --group dev python -m scripts.docs.check_docs --root .

      - run: uv run --group dev python -m scripts.docs.build_docs --wiki --root .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wiki-${{ github.sha }}
          path: generated/wiki
          if-no-files-found: error
          retention-days: 1

  wiki:
    if: github.ref == 'refs/heads/main'
    needs: wiki-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wiki-${{ github.sha }}
          path: generated/wiki

      - name: Verify privileged local wiki-push script
        run: echo "eadc538e18f5e13642df306e6e7e589bfa4719a43af44b9f1fc5a5c2bd35421a  scripts/docs/push_wiki.py" | sha256sum --check --strict

      - name: Push generated wiki
        env:
          WIKI_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: /usr/bin/python3 -I scripts/docs/push_wiki.py --push --root .
