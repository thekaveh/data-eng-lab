name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-consumer-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
      - name: Validate the pinned Atlas consumer contract
        env:
          MINIO_ROOT_USER: ci-placeholder-user
          MINIO_ROOT_PASSWORD: ci-placeholder-password
        run: |
          cp infra/.env.example infra/.env
          cp atlas.env.user.example atlas.env.user
          cd infra
          ./start.sh env backfill
          ./start.sh --consumer ../atlas.consumer.yml compose validate
          ./start.sh --consumer ../atlas.consumer.yml doctor --format json

  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive      # pinned Atlas contract tests import and assemble it
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Prepare consumer validation environment
        run: cp atlas.env.user.example atlas.env.user
      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
      - name: Lint
        run: uv run ruff check .
      - name: Verify repo structure
        run: uv run python scripts/verify_repo.py --root .
      - name: Unit + static tests (offline)
        run: uv run pytest -m "not infra and not network" -q

  docs-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
      - name: Run canonical docs gate
        run: make docs-check
      - name: Lint docs tooling
        run: uv run --group dev ruff check scripts/docs/
      - name: Test docs tooling
        run: uv run --group dev pytest tests/scripts/docs/ -q

  maven-spark-apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + test all Maven Spark apps (scalatest + shade)
        run: |
          for pom in spark-apps/*/pom.xml; do
            echo "::group::$pom"; mvn -q -B -f "$pom" package; echo "::endgroup::"
          done
